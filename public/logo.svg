<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="tGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with shadow -->
  <circle cx="100" cy="100" r="85" fill="url(#bgGradient)" filter="url(#shadow)" opacity="0.95"/>
  
  <!-- 3D T letter -->
  <path d="M70,70 L130,70 L130,90 L110,90 L110,130 L90,130 L90,90 L70,90 Z" fill="url(#tGradient)"/>
  
  <!-- Accent line -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>